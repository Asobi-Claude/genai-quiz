<!doctype html><meta charset="utf-8"><base href="/"><title>export check</title>
<link rel="stylesheet" href="css/style.css">
<div id="app" class="app"></div>
<script src="js/data.js"></script><script src="js/logic.js"></script><script src="js/store.js"></script><script src="js/study.js"></script><script src="js/app.js"></script>
<script>
/* 設定の「分析用データを書き出す」の確認。 */
var res = [];
function ok(c, m) { res.push((c ? "ok " : "NG ") + m); }
window.onerror = function (m) { res.push("NG error: " + m); };
(async function () {
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  while (!document.querySelector(".app h1")) await sleep(100);
  var Store = window.__quiz.Store, S = Store.state, Q = window.QUIZ_DATA.questions.filter(function (q) { return q.status === "reviewed"; });
  function findBtn(t) { return [].slice.call(document.querySelectorAll("button")).filter(function (b) { return b.textContent.indexOf(t) >= 0; })[0]; }
  // 回答0件
  location.hash = "#/settings"; await sleep(500);
  var b = findBtn("分析用データを書き出す");
  ok(!!b, "ボタンがある");
  ok(b && b.disabled, "回答0件ではボタンが押せない");
  ok(/まだ回答がありません/.test(document.body.textContent), "0件の案内が出る");
  // 回答105件（過去分の chosen なしを含む）
  for (var i = 0; i < 105; i++) { var q = Q[i * 7 % Q.length]; Store.addAnswer({ qid: q.id, category_id: q.category_id, subtopic_id: q.subtopic_id, difficulty: q.difficulty, correct: i % 3 !== 0, chosen: i < 10 ? undefined : (i % 4), version: q.version, ts: 1000 + i, date: "2026-11-2" + (i % 9) }); }
  location.hash = "#/home"; await sleep(300); location.hash = "#/settings"; await sleep(500);
  b = findBtn("分析用データを書き出す");
  ok(b && !b.disabled, "回答があればボタンが押せる");
  ok(/直近100問を書き出します/.test(document.body.textContent), "件数表示は直近100問");
  // ダウンロード内容を取得する（Blob の中身を覗く）
  var blobs = [];
  var orig = URL.createObjectURL; URL.createObjectURL = function (bl) { blobs.push(bl); return orig.call(URL, bl); };
  HTMLAnchorElement.prototype.click = function () {}; // 実際のダウンロードは起こさない（ヘッドレスで固まるため）
  b.click(); await sleep(400);
  ok(blobs.length === 1, "ダウンロードが1回起きる");
  var txt = await blobs[0].text(), j = JSON.parse(txt);
  ok(j.app === "genai-quiz-analysis" && j.answers.length === 100, "中身は分析用の形式で100件: " + j.app + "/" + j.answers.length);
  ok(j.answers.some(function (a) { return a.chosen === null; }) && j.answers.every(function (a) { return "chosen" in a; }), "chosen の無い回答は null で出る");
  ok(!/email|mail|name/i.test(txt.replace(/category_id|subtopic_id/g, "")), "個人情報らしい項目を含まない");
  var t = (res.some(function (x) { return x.indexOf("NG") === 0; }) ? "FAIL" : "PASS") + " | " + res.join(" | ");
  document.title = t; if (parent !== window) parent.postMessage({ title: t }, "*");
})();
</script>
