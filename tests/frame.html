<!doctype html><meta charset="utf-8"><title>frame</title>
<body style="margin:0;background:#888">
<iframe id="f" style="border:0;width:390px;height:880px;background:#fff"></iframe>
<script>
/* 幅390pxのフレームの中で確認ページを動かす。結果はフレームから受け取り、この文書の title に出す。 */
var q = location.search.replace(/^\?/, "");
var page = new URLSearchParams(q).get("page") || "reader.check.html";
var rest = q.replace(/(^|&)page=[^&]*/, "").replace(/^&/, "");
window.addEventListener("message", function (e) { if (e.data && e.data.title) document.title = e.data.title; });
document.getElementById("f").src = "/tests/" + page + (rest ? "?" + rest : "");
</script>
