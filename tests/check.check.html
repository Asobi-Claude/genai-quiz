<!doctype html><meta charset="utf-8"><base href="/"><title>check questions check</title>
<link rel="stylesheet" href="css/style.css">
<div id="app" class="app"></div>
<script src="js/data.js"></script><script src="js/logic.js"></script><script src="js/store.js"></script><script src="js/study.js"></script><script src="js/app.js"></script>
<script>
/* 確認問題の確認。確認問題は answers・reviews・scores・sessions に書かず、checks にだけ書く。 */
var res = [];
function ok(c, m) { res.push((c ? "ok " : "NG ") + m); }
window.onerror = function (m) { res.push("NG error: " + m); };
(async function () {
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  while (!document.querySelector(".app h1")) await sleep(100);
  var S = window.__quiz.Store.state;
  var before = [S.answers.length, Object.keys(S.reviews).length, S.scores.length, S.sessions.length];
  location.hash = "#/study/r-sample"; await sleep(1500);
  // 最初の弱点の最終章（確認問題つき）まで進む
  var btn;
  for (var i = 0; i < 6 && !(btn = document.querySelector(".r-check .btn")); i++) { document.querySelector(".r-next").click(); await sleep(150); }
  ok(!!btn, "最終章に『確認問題を解く』がある");
  btn.click(); await sleep(300);
  ok(!document.querySelector("#unsure"), "確認問題には『自信がない』のチェックを出さない");
  for (var k = 0; k < 3; k++) {
    document.querySelectorAll(".choice")[k % 4].click(); await sleep(50);
    [].slice.call(document.querySelectorAll("button")).filter(function (b) { return b.textContent === "回答する"; })[0].click(); await sleep(100);
    var nx = [].slice.call(document.querySelectorAll("button")).filter(function (b) { return /次の問題へ|結果を見る/.test(b.textContent); })[0];
    nx.click(); await sleep(150);
  }
  ok(S.checks.length === 3, "checks に3件: " + S.checks.length);
  ok(S.checks.every(function (c) { return /^k-/.test(c.qid) && c.reportId === "r-sample" && typeof c.chosen === "number"; }), "checks の中身（qid・reportId・chosen）");
  var after = [S.answers.length, Object.keys(S.reviews).length, S.scores.length, S.sessions.length];
  ok(JSON.stringify(before) === JSON.stringify(after), "answers/reviews/scores/sessions は変わらない: " + JSON.stringify(after));
  ok(/確認問題/.test(document.body.textContent) && /\/ 3/.test(document.body.textContent), "確認問題の結果画面が出る");
  var back = [].slice.call(document.querySelectorAll("a,button")).filter(function (b) { return b.textContent.indexOf("レポートに戻る") >= 0; })[0];
  ok(!!back, "『レポートに戻る』がある");
  if (back) { back.click(); await sleep(800); }
  ok(!!document.querySelector(".reader"), "レポートの読む画面に戻る");
  // 通常のクイズは従来どおり scores を増やす
  location.hash = "#/home"; await sleep(500);
  var start = [].slice.call(document.querySelectorAll("button")).filter(function (b) { return b.textContent.indexOf("6問だけ") >= 0; })[0];
  start.click(); await sleep(200);
  for (var n = 0; n < 6; n++) {
    document.querySelectorAll(".choice")[0].click(); await sleep(30);
    [].slice.call(document.querySelectorAll("button")).filter(function (b) { return b.textContent === "回答する"; })[0].click(); await sleep(50);
    [].slice.call(document.querySelectorAll("button")).filter(function (b) { return /次の問題へ|結果を見る/.test(b.textContent); })[0].click(); await sleep(80);
  }
  ok(S.scores.length === 1 && S.sessions.length === 1 && S.answers.length === 6, "通常クイズは従来どおり記録される: " + S.scores.length + "/" + S.sessions.length + "/" + S.answers.length);
  var t = (res.some(function (x) { return x.indexOf("NG") === 0; }) ? "FAIL" : "PASS") + " | " + res.join(" | ");
  document.title = t; if (parent !== window) parent.postMessage({ title: t }, "*");
})();
</script>
