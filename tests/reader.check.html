<!doctype html><meta charset="utf-8"><base href="/"><title>reader check</title>
<link rel="stylesheet" href="css/style.css">
<div id="app" class="app"></div>
<script src="js/data.js"></script><script src="js/logic.js"></script><script src="js/store.js"></script><script src="js/study.js"></script><script src="js/app.js"></script>
<script>
/* 読む画面の確認。結果は <title> に PASS / FAIL で出る（--dump-dom で読む）。 */
var res = [];
function ok(c, m) { res.push((c ? "ok " : "NG ") + m); }
window.onerror = function (m) { res.push("NG error: " + m); };
res.push("viewport " + window.innerWidth);
var SHOT = new URLSearchParams(location.search).get("shot");
(async function () {
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  while (!document.querySelector(".app h1")) await sleep(100);
  var S = window.__quiz.Store.state;
  if (SHOT) {
    var parts = SHOT.split("-"); // 例: paper-mincho-l-settings
    S.settings.reader = { theme: parts[0], font: parts[1], size: parts[2] };
    location.hash = "#/study/r-sample"; await sleep(1200);
    if (parts[4]) { var n = +parts[4]; for (var i = 0; i < n; i++) { document.querySelector(".r-next").click(); await sleep(150); } }
    if (parts[3] === "settings") document.querySelector(".r-aa").click();
    if (parts[3] === "toc") document.querySelector(".r-toc").click();
    await sleep(300); document.title = "SHOT"; if (parent !== window) parent.postMessage({ title: "SHOT" }, "*"); return;
  }
  location.hash = "#/study/r-sample"; await sleep(1500);
  var count = function () { var e = document.querySelector(".r-count"); return e ? e.textContent : ""; };
  var prog = function () { var e = document.querySelector("[role=progressbar]"); return e ? +e.getAttribute("aria-valuenow") : -1; };
  var total = +(count().split("/")[1] || 0);
  ok(total >= 5, "章が複数ある: " + count());
  var p0 = prog();
  document.querySelector(".r-next").click(); await sleep(200);
  ok(prog() > p0, "次の章へで進捗が増える");
  ok(S.study["r-sample"] && S.study["r-sample"].chapter === 1, "読みかけ位置が保存される");
  // 開き直しても同じ章から
  location.hash = "#/study"; await sleep(800);
  location.hash = "#/study/r-sample"; await sleep(1000);
  ok(count().indexOf("2 /") === 0, "開き直すと同じ章から: " + count());
  // 章数が減ったあとに古い位置が残っていても最後の章に丸める
  window.__quiz.Store.setStudy("r-sample", { chapter: 99 });
  location.hash = "#/study"; await sleep(500);
  location.hash = "#/study/r-sample"; await sleep(1000);
  ok(count().split(" / ")[0] === String(total), "範囲外の位置は最後の章に丸める: " + count());
  // 幅の広い表でもページが横にあふれない（10列の表を差し込んで確かめる）
  (function () {
    var cells = ""; for (var i = 0; i < 10; i++) cells += "<td>横幅をとる長い文言がここに入ります</td>";
    var w = document.createElement("div"); w.className = "tbl-wrap";
    w.innerHTML = '<table class="r-tbl"><tbody><tr>' + cells + "</tr></tbody></table>";
    document.querySelector(".r-art").appendChild(w);
  })();
  await sleep(100);
  var wraps = document.querySelectorAll(".tbl-wrap"), wide = wraps[wraps.length - 1];
  ok(wide.scrollWidth > wide.clientWidth, "表は枠の中で横にスクロールする: " + wide.scrollWidth + ">" + wide.clientWidth);
  ok(document.documentElement.scrollWidth <= window.innerWidth, "横にあふれない: " + document.documentElement.scrollWidth + "/" + window.innerWidth);
  // 表示設定の保存
  document.querySelector(".r-aa").click(); await sleep(200);
  var big = [].slice.call(document.querySelectorAll(".r-sheet [role=radio]")).filter(function (b) { return b.textContent === "特大"; })[0];
  if (big) big.click();
  await sleep(100);
  ok(S.settings.reader.size === "xl", "文字サイズ設定が保存される");
  var t = (res.some(function (x) { return x.indexOf("NG") === 0; }) ? "FAIL" : "PASS") + " | " + res.join(" | ");
  document.title = t; if (parent !== window) parent.postMessage({ title: t }, "*");
})();
</script>
